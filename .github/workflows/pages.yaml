name: pages

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  # Allows re-publishing without a commit, e.g. after changing a Pages setting.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Separate from `ci`, which builds the site on every pull request to catch a
  # spec change that breaks it. This one publishes, and only from `main`, so a
  # branch cannot overwrite what the designer is reviewing.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
